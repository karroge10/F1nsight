[project]
name = "f1-pipeline"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastf1>=3.8.3",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=2.3.3",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "pypdf>=6.20.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "f1p"
