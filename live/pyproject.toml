[project]
name = "f1live"
version = "0.1.0"
description = "F1 live timing and replay relay (FastAPI, WebSocket)"
readme = "README.md"
authors = [
    { name = "Egor Kabantsov", email = "59362666+karroge10@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "pyarrow>=25.0.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
f1live = "f1live:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
